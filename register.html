<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Register for MediCare+ - Create your account to book doctor appointments, track health records, and view schedules.">
    <title>Register | MediCare+ Medical System</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">

    <style>
        .auth-wrapper {
            min-height: calc(100vh - 160px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #eff6ff 0%, #f8fafc 100%);
        }

        .auth-card {
            background: var(--white);
            width: 100%;
            max-width: 540px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xl);
            padding: 40px;
            border: 1px solid var(--border-color);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-header .logo-badge {
            font-size: 2.2rem;
            color: var(--primary-color);
            margin-bottom: 8px;
        }

        .auth-header h2 {
            font-size: 1.75rem;
            color: var(--dark-color);
            margin-bottom: 6px;
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .role-selector {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .role-option {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .role-option input {
            display: none;
        }

        .role-option:has(input:checked) {
            border-color: var(--primary-color);
            background: var(--primary-light);
            color: var(--primary-color);
        }

        .password-meter {
            height: 4px;
            background: #e2e8f0;
            border-radius: 2px;
            margin-top: 6px;
            overflow: hidden;
        }

        .password-meter-fill {
            height: 100%;
            width: 0%;
            transition: var(--transition);
        }
    </style>
</head>
<body>

    <!-- Header & Navbar -->
    <header id="navbar">
      <nav class="navbar" aria-label="Main Navigation">
        <div class="logo">
          <a href="index.html">MediCare+</a>
        </div>
        <ul class="nav-links" role="list">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="doctors.html">Doctors</a></li>
          <li><a href="appointment.html">Appointment</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
        <div class="nav-actions">
          <a href="login.html" class="btn btn-outline" id="loginBtn">Login</a>
          <a href="register.html" class="btn btn-primary" id="registerBtn">Register</a>
        </div>
        <button id="mobileToggle" class="mobile-toggle" aria-label="Toggle Navigation Menu">
          <i class="fa-solid fa-bars"></i>
        </button>
      </nav>
    </header>

    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo-badge"><i class="fa-solid fa-user-plus"></i></div>
                <h2>Create Your Account</h2>
                <p>Join MediCare+ to book doctors and manage appointments</p>
            </div>

            <form id="registerForm" novalidate>
                <div class="form-group">
                    <label><i class="fa-solid fa-user-gear"></i> Account Type</label>
                    <div class="role-selector">
                        <label class="role-option">
                            <input type="radio" name="role" value="patient" checked>
                            <i class="fa-solid fa-user-injured"></i> Patient
                        </label>
                        <label class="role-option">
                            <input type="radio" name="role" value="doctor">
                            <i class="fa-solid fa-user-doctor"></i> Doctor
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="name"><i class="fa-regular fa-user"></i> Full Name</label>
                    <input type="text" id="name" class="form-control" placeholder="e.g. Full Name" required data-label="Full Name">
                </div>

                <div class="form-group">
                    <label for="email"><i class="fa-regular fa-envelope"></i> Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="e.g. Email Address" required data-label="Email Address">
                </div>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label for="phone"><i class="fa-solid fa-phone"></i> Phone Number</label>
                        <input type="tel" id="phone" class="form-control" placeholder="+92 300 1234567" required data-label="Phone Number">
                    </div>
                    <div class="form-group">
                        <label for="cnic"><i class="fa-regular fa-id-card"></i> CNIC (Optional)</label>
                        <input type="text" id="cnic" class="form-control" placeholder="42101-1234567-1">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
                    <input type="password" id="password" class="form-control" placeholder="At least 6 characters" required data-label="Password">
                    <div class="password-meter"><div id="passFill" class="password-meter-fill"></div></div>
                    <small id="passFeedback" style="font-size: 0.75rem; color: var(--text-muted);"></small>
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="width: 100%; margin-top: 10px;">
                    <i class="fa-solid fa-user-check"></i> Register Account
                </button>
            </form>

            <div style="text-align: center; margin-top: 24px; font-size: 0.9rem;">
                Already have an account? <a href="login.html" style="font-weight: 600;">Sign In</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container footer-bottom" style="text-align: center;">
            <p>&copy; 2026 MediCare+ Medical Appointment System. All Rights Reserved.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/storage.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
    <script>
        const passInput = document.getElementById('password');
        const passFill = document.getElementById('passFill');
        const passFeedback = document.getElementById('passFeedback');

        passInput.addEventListener('input', () => {
            const val = passInput.value;
            const res = FormValidator.checkPasswordStrength(val);
            if (!val) {
                passFill.style.width = '0%';
                passFeedback.textContent = '';
                return;
            }
            const colors = ['#ef4444', '#f59e0b', '#10b981', '#059669'];
            const widths = ['25%', '50%', '75%', '100%'];
            passFill.style.width = widths[res.score - 1] || '100%';
            passFill.style.backgroundColor = colors[res.score - 1] || '#ef4444';
            passFeedback.textContent = `Strength: ${res.message}`;
        });

        document.getElementById('registerForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const form = e.target;
            if (!FormValidator.validateForm(form)) return;

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const cnic = document.getElementById('cnic').value.trim();
            const password = document.getElementById('password').value;
            const role = document.querySelector('input[name="role"]:checked').value;

            const res = AuthManager.register({ name, email, phone, cnic, password, role });
            if (res.success) {
                showToast('Account registered successfully! Redirecting...', 'success');
                setTimeout(() => {
                    if (role === 'admin') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                }, 1000);
            } else {
                showToast(res.message, 'error');
            }
        });
    </script>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="mobile-bottom-nav" aria-label="Mobile Navigation">
        <div class="mbn-inner">
            <a href="index.html" class="mbn-tab" id="mbn-home"><i class="fa-solid fa-house"></i><span>Home</span></a>
            <a href="about.html" class="mbn-tab" id="mbn-about"><i class="fa-solid fa-circle-info"></i><span>About</span></a>
            <a href="appointment.html" class="mbn-tab mbn-book" id="mbn-book"><i class="fa-solid fa-calendar-plus"></i><span>Book</span></a>
            <a href="doctors.html" class="mbn-tab" id="mbn-doctors"><i class="fa-solid fa-user-doctor"></i><span>Doctors</span></a>
            <a href="contact.html" class="mbn-tab" id="mbn-contact"><i class="fa-solid fa-envelope"></i><span>Contact</span></a>
        </div>
    </nav>
</body>
</html>
